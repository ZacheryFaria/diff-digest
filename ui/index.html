<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Diff digest</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github-dark.min.css" />
<link rel="stylesheet" href="/ui/styles.css" />
</head>
<body>
<header id="toolbar">
  <div class="meta" id="meta"></div>
  <div class="actions" id="actions">
    <span class="listen" id="listen" title="Is a Claude session waiting for actions?"></span>
    <button id="apply" class="primary">Apply comments</button>
    <button id="post-review" hidden>Post comments…</button>
    <button id="publish" hidden>Post digest</button>
    <button id="review">Review with agent</button>
  </div>
</header>
<dialog id="review-dialog">
  <form method="dialog">
    <div class="dialog-head">
      <b>Comments for the PR</b>
      <span id="review-count"></span>
    </div>
    <p class="dialog-note">This is one Markdown comment made from your open comments. You can edit it before you post it.</p>
    <textarea id="review-body" spellcheck="false"></textarea>
    <div class="row">
      <button value="cancel">Cancel</button>
      <button id="review-copy" type="button">Copy</button>
      <button id="review-post" type="button" class="primary">Post to PR</button>
    </div>
  </form>
</dialog>
<div id="layout">
  <nav id="files"><div class="files-head">Files</div><div id="tree"></div></nav>
  <main id="digest"><article id="content"></article><section id="orphans"></section></main>
  <aside id="code" hidden>
    <div class="code-head">
      <span id="code-path"></span>
      <div class="tabs">
        <button data-rev="diff" class="on" title="The git diff for this file only">Diff</button>
        <button data-rev="head" title="The file after the change (this branch)">After</button>
        <button data-rev="base" title="The file before the change (the merge-base)">Before</button>
        <span class="menu-wrap">
          <button id="code-menu-btn" title="More actions for this file" hidden>⋯</button>
          <div id="code-menu" class="menu" hidden></div>
        </span>
        <button id="code-close" title="Close">✕</button>
      </div>
    </div>
    <div id="code-body"></div>
  </aside>
</div>
<div id="toast" hidden></div>
<script type="module" src="/ui/app.js"></script>
</body>
</html>
